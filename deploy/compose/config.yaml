server:
  listen: ":8080"
  public_base_url: "http://localhost:8080"

logging:
  level: info
  format: json

vips:
  block_untrusted: true
  blocked_operations:
    - VipsForeignLoadPdf

iiif:
  allowed_origins:
    - "*"
  image:
    enabled: true
    prefix: /iiif/3
    max_output_pixels: 100000000
    allow_unsafe_unlimited_output_pixels: false
    max_source_pixels: 250000000
    max_source_bytes: 1073741824
    max_derivative_bytes: 536870912
    max_concurrent_transforms: 4
    color_management: preserve
    load_access: auto
    info_dimension_cache: true
  presentation:
    enabled: true
    prefix: /presentation/v3
    root: /var/lib/triplet/presentation
    write_enabled: ${TRIPLET_PRESENTATION_WRITE_ENABLED}
    write_token: "${TRIPLET_PRESENTATION_WRITE_TOKEN}"
  search:
    enabled: false
    prefix: /search/v2
  auth:
    enabled: false
    prefix: /auth/v2
    development_permit_all: false

sources:
  default: file
  file:
    root: /var/lib/triplet/images
  # Enable only when this deployment should fetch remote source images.
  # The allowlist is the security boundary for HTTP identifiers: redirects are
  # rechecked, an empty list denies all hosts, and `*` should only be used on
  # closed internal networks.
  # http:
  #   allowed_hosts: [images.example.org]
  #   allow_private_hosts: false
  #   request_timeout: 2m
  #   max_bytes: 52428800

cache:
  root: /var/lib/triplet/cache
  max_bytes: 1073741824
  source_root: /var/lib/triplet/source-cache
  source_max_bytes: 1073741824
  source_stale_after: 24h

extensions:
  transform:
    enabled: false
  uploads:
    enabled: false
