services:
  mariadb:
    image: mariadb:12@sha256:b1c7bf836e64ed9406a8984af29509f40089d55cea14b32f12c4726a1f17104b
    profiles:
      - integration
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-scribe}
      MARIADB_USER: ${MARIADB_USER:-scribe}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-scribe}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-scribe-root}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  triplet:
    image: ${TRIPLET_IMAGE:-ghcr.io/libops/triplet:${GIT_BRANCH:-main}}
    # Or build from the repo root:
    # build:
    #   context: ../..
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/triplet/config.yaml:ro
      - ./images:/var/lib/triplet/images:ro
      - ./presentation:/var/lib/triplet/presentation
      - ./cache:/var/lib/triplet/cache
      - ./source-cache:/var/lib/triplet/source-cache
      # Optional private CA bundle for upstream HTTPS sources. Concatenate one
      # or more PEM-encoded CA certs into this file; Go's TLS verifier reads
      # PEM files directly from /etc/ssl/certs.
      # - ./certs/lehigh-ca.pem:/etc/ssl/certs/lehigh-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      - seccomp:../seccomp-triplet.json
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "triplet-healthcheck", "-url", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mariadb:
