site_name: Triplet
site_description: A IIIF server in Go
repo_url: https://github.com/libops/triplet
site_url: !ENV [ SITE_URL, "https://libops.github.io/triplet/" ]
docs_dir: .
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - search.highlight
  palette:
    primary: indigo
    accent: blue

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: libops
      repo: triplet
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ""
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - css/custom.css

extra_javascript:
  - js/mermaid-init.mjs

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Authorization: authorization.md
  - Caching: caching.md
  - Format support: formats.md
  - libvips build: libvips.md
  - Deploys: deploys.md
  - Conformance: conformance.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md
