name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image and run tests
        run: make test

      - name: Run ASAN tests
        run: make test-asan

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build smoke image
        run: docker build --target runtime -t triplet:ci .

      - name: Start compose stack
        working-directory: deploy/compose
        env:
          TRIPLET_IMAGE: triplet:ci
        run: docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/docker-compose.yaml ps
          exit 1

      - name: Prepare conformance fixture
        run: |
          mkdir -p deploy/compose/images
          printf 'P3\n1 1\n255\n255 255 255\n' > deploy/compose/images/sample.ppm

      - name: Run conformance smoke
        env:
          TRIPLET_CONFORMANCE_IDENTIFIER: sample.ppm
        run: ./scripts/conformance.sh

      - name: Show compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color

      - name: Tear down compose stack
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
