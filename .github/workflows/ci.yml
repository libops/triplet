name: build-push

on:
  push:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ">=1.26.2"

      - name: Cache Go tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-golang-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-golang-

      - name: Install cgo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: latest
          install-only: true

      - name: lint
        run: make lint

      - name: test
        run: make test-race

      - name: asan
        run: make test-asan

  push-images:
    needs: [ lint-test ]
    uses: libops/.github/.github/workflows/build-push.yaml@f39fff4fbd5096221d705143e88e5942f5d9a604 # main
    permissions:
      contents: read
      packages: write
    secrets: inherit

  integration-test:
    needs: [ lint-test, push-images ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set branch image tag
        shell: bash
        run: echo "GIT_BRANCH=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Install conformance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 python3-venv

      - name: integration tests
        run: make test-integration

      - name: Show compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yaml -p triplet-integration logs
          --no-color
