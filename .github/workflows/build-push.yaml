name: build-push

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ">=1.26.2"
          cache-dependency-path: go.sum

      - name: Cache Go tool binaries
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-bin-

      - name: Cache container Go test state
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-container-go-${{ hashFiles('go.sum', 'Dockerfile', 'scripts/test.sh', 'scripts/go-test-container.sh') }}
          restore-keys: |
            ${{ runner.os }}-container-go-

      - name: Install cgo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: latest
          install-only: true

      - name: lint
        run: make lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build cached test runner
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ./Dockerfile
          target: test-runner
          load: true
          tags: triplet-test:dev
          cache-from: type=gha,scope=triplet-test-runner-${{ runner.os }}
          cache-to: type=gha,scope=triplet-test-runner-${{ runner.os }},mode=max

      - name: test
        env:
          TRIPLET_TEST_SKIP_BUILD: "1"
        run: make test-race

      - name: asan
        env:
          TRIPLET_TEST_SKIP_BUILD: "1"
        run: make test-asan

  push-images:
    needs: [ lint-test ]
    uses: libops/.github/.github/workflows/build-push.yaml@f39fff4fbd5096221d705143e88e5942f5d9a604 # main
    permissions:
      contents: read
      packages: write
    secrets: inherit

  integration-test:
    needs: [ lint-test, push-images ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set branch image tag
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          tag="$(printf '%s' "$branch" | sed 's/[^a-zA-Z0-9._-]//g' | awk '{print substr($0, length($0)-120)}')"
          echo "GIT_BRANCH=$tag" >> "$GITHUB_ENV"

      - name: Cache container Go test state
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-container-go-${{ hashFiles('go.sum', 'Dockerfile', 'scripts/test.sh', 'scripts/go-test-container.sh') }}
          restore-keys: |
            ${{ runner.os }}-container-go-

      - name: Cache IIIF validator
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: .cache/iiif-validator
          key: ${{ runner.os }}-iiif-validator-${{ hashFiles('scripts/ensure-iiif-validator.sh') }}
          restore-keys: |
            ${{ runner.os }}-iiif-validator-

      - name: Install conformance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 python3-venv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build cached test runner
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ./Dockerfile
          target: test-runner
          load: true
          tags: triplet-test:dev
          cache-from: type=gha,scope=triplet-test-runner-${{ runner.os }}
          cache-to: type=gha,scope=triplet-test-runner-${{ runner.os }},mode=max

      - name: integration tests
        env:
          TRIPLET_TEST_SKIP_BUILD: "1"
        run: make test-integration

      - name: Show compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yaml -p triplet-integration logs
          --no-color

  benchmark-matrix:
    needs: [ push-images ]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Find open PR
        id: find_pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          result-encoding: string
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            return pulls[0]?.number ?? '';

      - name: Log in to GHCR
        if: steps.find_pr.outputs.result != ''
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run IIIF benchmark matrix
        if: steps.find_pr.outputs.result != ''
        id: benchmarks
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.result }}
        run: make benchmark-iiif-pr

      - name: Comment PR with benchmark results
        if: always() && steps.find_pr.outputs.result != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('benchmark_results.md', 'utf8');
            const marker = '<!-- triplet-iiif-benchmark-results -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.find_pr.outputs.result }}'),
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: results,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number('${{ steps.find_pr.outputs.result }}'),
                body: results,
              });
            }

      - name: Fail if benchmarks failed
        if: steps.find_pr.outputs.result != '' && steps.benchmarks.outcome == 'failure'
        run: exit 1
